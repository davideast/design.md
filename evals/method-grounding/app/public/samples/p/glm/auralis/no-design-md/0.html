<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auralis — Making digital experiences sound human</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0b0d;
    --bg-2:#0e0f12;
    --surface:#131418;
    --surface-2:#17181c;
    --surface-3:#1d1e23;
    --border:#232428;
    --border-2:#2c2d33;
    --text:#f5f5f5;
    --text-2:#a1a1a6;
    --text-3:#6e6e74;
    --accent:#c8ff00;
    --accent-2:#a3d800;
    --accent-glow:rgba(200,255,0,0.18);
    --danger:#ff4d4d;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --sans:'Inter',system-ui,sans-serif;
    --radius:14px;
    --radius-sm:8px;
    --radius-lg:22px;
  }
  html{scroll-behavior:smooth}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::selection{background:var(--accent);color:#000}
  .wrap{max-width:1280px;margin:0 auto;padding:0 28px}
  .mono{font-family:var(--mono);letter-spacing:-0.01em}

  /* ===== NAV ===== */
  nav{
    position:sticky;top:0;z-index:50;
    background:rgba(10,11,13,0.78);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    border-bottom:1px solid var(--border);
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px;gap:32px}
  .brand{font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:-0.02em;display:flex;align-items:center;gap:10px}
  .brand .dot{width:9px;height:9px;background:var(--accent);border-radius:50%;box-shadow:0 0 14px var(--accent-glow)}
  .nav-links{display:flex;gap:30px;list-style:none}
  .nav-links a{font-size:13.5px;color:var(--text-2);font-weight:500;transition:color .2s}
  .nav-links a:hover{color:var(--text)}
  .nav-cta{display:flex;align-items:center;gap:10px}
  .btn{font-family:var(--mono);font-size:12.5px;font-weight:500;letter-spacing:0.02em;padding:9px 16px;border-radius:8px;transition:all .2s;display:inline-flex;align-items:center;gap:7px;border:1px solid transparent}
  .btn-primary{background:var(--accent);color:#0a0b0d;font-weight:600}
  .btn-primary:hover{background:#dfff3c;box-shadow:0 0 24px var(--accent-glow)}
  .btn-ghost{color:var(--text-2);border-color:var(--border-2)}
  .btn-ghost:hover{color:var(--text);border-color:var(--text-3)}
  .btn-sm{padding:8px 14px;font-size:11.5px}

  /* ===== HERO ===== */
  .hero{padding:140px 0 90px;position:relative;overflow:hidden}
  .hero::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(60% 50% at 50% 0%,rgba(200,255,0,0.06) 0%,transparent 60%),
      radial-gradient(40% 40% at 80% 30%,rgba(200,255,0,0.04) 0%,transparent 70%);
    pointer-events:none;
  }
  .hero-inner{position:relative;text-align:center;max-width:980px;margin:0 auto}
  .hero-eyebrow{
    font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:0.18em;
    color:var(--accent);text-transform:uppercase;
    display:inline-flex;align-items:center;gap:10px;
    padding:7px 14px;border:1px solid var(--border-2);border-radius:100px;
    margin-bottom:36px;background:var(--surface);
  }
  .hero-eyebrow .pulse{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent-glow);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,255,0,0.5)}70%{box-shadow:0 0 0 8px rgba(200,255,0,0)}100%{box-shadow:0 0 0 0 rgba(200,255,0,0)}}
  .hero h1{
    font-size:clamp(44px,7vw,84px);font-weight:800;letter-spacing:-0.035em;line-height:1.02;
    margin-bottom:42px;
  }
  .hero h1 .accent{color:var(--accent);font-style:italic;font-weight:800}
  .hero-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .btn-lg{padding:13px 22px;font-size:13px}

  /* ===== SECTION HEADER ===== */
  .sec{padding:96px 0;position:relative}
  .sec-head{margin-bottom:48px;max-width:720px}
  .sec-eyebrow{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:0.18em;color:var(--text-3);text-transform:uppercase;margin-bottom:18px}
  .sec-title{font-size:clamp(32px,4vw,52px);font-weight:800;letter-spacing:-0.03em;line-height:1.05}
  .sec-sub{margin-top:18px;color:var(--text-2);font-size:16px;max-width:620px;line-height:1.6}

  /* ===== PRODUCT DEMO PANEL ===== */
  .demo-wrap{position:relative}
  .demo{
    background:var(--surface);
    border:1px solid var(--border-2);
    border-radius:var(--radius-lg);
    overflow:hidden;
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  .demo-titlebar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;background:var(--bg-2);
    border-bottom:1px solid var(--border);
  }
  .traffic{display:flex;gap:7px}
  .traffic span{width:11px;height:11px;border-radius:50%}
  .traffic span:nth-child(1){background:#ff5f57}
  .traffic span:nth-child(2){background:#febc2e}
  .traffic span:nth-child(3){background:#28c840}
  .demo-title{font-family:var(--mono);font-size:11.5px;color:var(--text-3);letter-spacing:0.08em;text-transform:uppercase}
  .demo-title .live{color:var(--accent);margin-left:8px}
  .demo-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg-2);padding:0 18px}
  .demo-tab{
    font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:0.02em;
    padding:14px 18px;color:var(--text-3);border-bottom:2px solid transparent;
    transition:all .2s;position:relative;top:1px;
  }
  .demo-tab.active{color:var(--text);border-bottom-color:var(--accent)}
  .demo-tab:hover{color:var(--text-2)}
  .demo-statusbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 22px;background:var(--bg-2);border-bottom:1px solid var(--border);
    font-family:var(--mono);font-size:11px;letter-spacing:0.06em;
  }
  .status-label{display:flex;align-items:center;gap:9px;color:var(--text-2);text-transform:uppercase}
  .status-label .live-dot{
    width:7px;height:7px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px var(--accent-glow);animation:blink 1.4s infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
  .status-meta{color:var(--text-3);display:flex;gap:18px}
  .status-meta span b{color:var(--text-2);font-weight:500}

  .demo-stage{
    position:relative;
    height:360px;
    background:
      radial-gradient(ellipse at center,rgba(200,255,0,0.05) 0%,transparent 60%),
      linear-gradient(180deg,var(--surface) 0%,#0e0f12 100%);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .stage-grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);
    background-size:32px 32px;
    mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);
  }
  .stage-rings{position:absolute;width:340px;height:340px;border-radius:50%;border:1px solid rgba(200,255,0,0.08);animation:slow-rotate 30s linear infinite}
  .stage-rings::before,.stage-rings::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(200,255,0,0.06)}
  .stage-rings::before{transform:scale(0.78)}
  .stage-rings::after{transform:scale(0.55);border-color:rgba(200,255,0,0.1)}
  @keyframes slow-rotate{to{transform:rotate(360deg)}}
  .play-btn{
    position:relative;z-index:2;
    width:84px;height:84px;border-radius:50%;
    background:var(--accent);color:#0a0b0d;
    display:flex;align-items:center;justify-content:center;
    transition:transform .2s;
    box-shadow:0 0 0 0 var(--accent-glow),0 18px 50px -10px rgba(200,255,0,0.4);
    animation:play-pulse 2.4s infinite;
  }
  .play-btn:hover{transform:scale(1.05)}
  .play-btn svg{width:30px;height:30px;margin-left:3px}
  @keyframes play-pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,255,0,0.4),0 18px 50px -10px rgba(200,255,0,0.4)}50%{box-shadow:0 0 0 18px rgba(200,255,0,0),0 18px 50px -10px rgba(200,255,0,0.4)}}

  .stage-wave{position:absolute;bottom:0;left:0;right:0;height:80px;display:flex;align-items:end;justify-content:center;gap:3px;padding:0 40px;opacity:0.55}
  .stage-wave span{flex:1;max-width:4px;background:var(--accent);border-radius:2px;animation:wave 1.2s ease-in-out infinite}
  .stage-wave span:nth-child(odd){animation-delay:-0.6s}
  .stage-wave span:nth-child(3n){animation-delay:-0.3s;height:30%}
  .stage-wave span:nth-child(4n){animation-delay:-0.9s}
  @keyframes wave{0%,100%{height:20%}50%{height:90%}}

  .stage-info{position:absolute;top:18px;left:22px;font-family:var(--mono);font-size:10.5px;color:var(--text-3);letter-spacing:0.08em}
  .stage-info b{color:var(--accent);font-weight:500}
  .stage-info-r{position:absolute;top:18px;right:22px;font-family:var(--mono);font-size:10.5px;color:var(--text-3);letter-spacing:0.08em;text-align:right}

  .demo-bottombar{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;background:var(--bg-2);
    border-top:1px solid var(--border);
  }
  .mode-links{display:flex;gap:4px;list-style:none;flex-wrap:wrap}
  .mode-links a{
    font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:0.02em;
    padding:12px 14px;color:var(--text-3);transition:color .2s;
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .mode-links a.active{color:var(--accent);border-bottom-color:var(--accent)}
  .mode-links a:hover:not(.active){color:var(--text-2)}
  .demo-bottombar .btn{margin:10px 0 10px 18px}

  /* ===== TRUST STRIP ===== */
  .trust{padding:72px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--bg-2)}
  .trust h2{text-align:center;font-size:14px;font-weight:500;color:var(--text-3);font-family:var(--mono);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:42px}
  .trust-logos{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:36px}
  .trust-logos span{font-family:var(--sans);font-weight:700;font-size:24px;letter-spacing:-0.02em;color:var(--text-2);opacity:0.72;transition:opacity .2s,color .2s;flex:1;text-align:center;min-width:120px}
  .trust-logos span:hover{opacity:1;color:var(--text)}

  /* ===== PLATFORM OVERVIEW ===== */
  .platform-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:48px}
  .feature-blurb{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:30px 28px;
    transition:border-color .2s;
  }
  .feature-blurb:hover{border-color:var(--border-2)}
  .blurb-num{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:0.1em;margin-bottom:14px}
  .blurb-title{font-size:20px;font-weight:700;letter-spacing:-0.02em;margin-bottom:10px}
  .blurb-desc{color:var(--text-2);font-size:14.5px;line-height:1.6}

  .dashboard{
    background:#070809;border:1px solid var(--border-2);border-radius:var(--radius-lg);
    overflow:hidden;
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.7);
  }
  .dash-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 18px;background:#0a0b0d;border-bottom:1px solid var(--border);
  }
  .dash-title{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;color:var(--text-3)}
  .dash-title b{color:var(--text-2);font-weight:500}
  .dash-badge{
    font-family:var(--mono);font-size:10px;letter-spacing:0.12em;font-weight:600;
    padding:5px 10px;background:var(--accent);color:#0a0b0d;border-radius:4px;
  }
  .dash-body{display:grid;grid-template-columns:1fr 1.6fr 1fr;min-height:280px}
  .dash-metrics{padding:22px 20px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:24px}
  .metric{display:flex;flex-direction:column;gap:6px}
  .metric-label{font-family:var(--mono);font-size:10px;letter-spacing:0.12em;color:var(--text-3);text-transform:uppercase}
  .metric-value{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-0.02em;color:var(--text)}
  .metric-value.accent{color:var(--accent)}
  .metric-value.status{font-size:14px;color:var(--accent);display:flex;align-items:center;gap:8px}
  .metric-value.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
  .dash-wave{padding:22px 18px;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between}
  .dash-wave-head{display:flex;align
