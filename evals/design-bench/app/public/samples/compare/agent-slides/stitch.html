<style>

            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-width: 1.5px;
            filter: url(#rough-paper-texture);
        }
    </style>

<body class="bg-handout-paper text-primary min-h-screen relative flex flex-col p-margin-page selection:bg-surface-variant">
<!-- Top Left Corner Metadata -->
<div class="absolute top-margin-page left-margin-page font-code text-code text-on-surface-variant flex flex-col gap-xs">

<div class="absolute top-margin-page right-margin-page font-code text-code text-on-surface-variant text-right">

</div>
<!-- Main Content Canvas - Optically Centered -->
<main class="flex-1 flex flex-col justify-center items-start w-full max-w-5xl mx-auto px-lg">
<!-- Loop Motif (Hand-drawn, Graphite) -->
<div aria-hidden="true" class="mb-lg w-12 h-12 text-graphite-ink opacity-80">
<svg class="w-full h-full" overflow="visible" viewbox="0 0 100 100">
<!-- SVG Filter for slight imperfection -->
<defs>
<filter height="140%" id="rough-paper-texture" width="140%" x="-20%" y="-20%">
<feturbulence basefrequency="0.04" numoctaves="3" result="noise" type="fractalNoise"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
</defs>
<!-- A continuous closed loop with slight wobbly geometry -->
<path class="hand-drawn-stroke stroke-current" d="M30,70 C10,70 10,30 30,30 C50,30 50,70 70,70 C90,70 90,30 70,30 C50,30 50,70 30,70 Z"></path>
</svg>
</div>
<!-- Title Block -->

<h1 class="font-display text-display text-primary tracking-tight">

            </h1>
<p class="font-body-md-italic text-body-md-italic text-on-surface-variant max-w-2xl pl-xs border-l-[1.5px] border-muted-graphite border-opacity-30">
                On loops, traces, and the structures by which language models act.
            </p>
</div>
</main>
<!-- Bottom Right Corner Page Numeral -->
<div class="absolute bottom-margin-page right-margin-page font-label-sm text-label-sm text-vermilion-accent uppercase tracking-widest">
